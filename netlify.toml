[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA: qualquer rota do react-router cai no index.html (evita 404 ao dar F5).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Assets com hash no nome podem ser cacheados para sempre.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# O HTML nunca deve ser cacheado, senão o deploy novo não aparece.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
